en:
  google_analytics_directions: Enter the complete <a href="https://analytics.google.com/">Google Analytics</a> or Matomo tracking snippet, including script tags, and choose which user groups to track. Administrators have their own option. Leave the code empty to disable tracking. The code is inserted into the page head and runs for the selected visitors.
  google_analytics_code_label: Tracking code (including script tags)
  google_analytics_log_anonymous_label: Log anonymous users
  google_analytics_log_authenticated_label: Log authenticated users (excluding administrators)
  google_analytics_log_administrator_label: Log administrator users
